<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Desert Outpost — Low-poly 3D Monument Valley idle diorama.">
  <meta name="theme-color" content="#C8794B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desert Outpost">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Desert Outpost</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #6693C9 0%, #AAC2DF 50%, #F7CCA6 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    #desert-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #35261D;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .loader-badge {
      padding: 10px 20px;
      background: #4B2E1E;
      color: #FFF6E3;
      border: 3px solid #7B4F34;
      border-radius: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      font-size: 15px;
      box-shadow: 0 5px 0 #341E13;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="desert-loader">
    <div class="loader-badge">DESERT OUTPOST</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('desert-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
